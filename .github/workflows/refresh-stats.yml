name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *" # Runs daily at 05:17 UTC
  workflow_dispatch:      # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate self-hosted SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit and push if changed
        run: |
          FILES="stats.svg streak.svg langs.svg year.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No stats changes detected. Skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh [skip ci]"
          git push
